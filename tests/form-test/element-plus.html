<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单自动填充测试 - Element Plus</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 30px; }
    h2 { color: #666; margin: 30px 0 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .form-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 200px; }
    .form-item label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    button.test-btn { background: #409eff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>表单自动填充测试 - Element Plus 框架</h1>
    <button class="test-btn" onclick="window.__bengaliFakeFill && window.__bengaliFakeFill()">🎯 点击填充表单</button>

    <div class="form-section">
      <h2>Element Plus 表单</h2>
      <div id="app"></div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus@2.9.6/dist/index.full.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.6/dist/index.css">

  <script>
    const { createApp, ref, reactive } = Vue;

    const App = {
      setup() {
        const form = reactive({
          username: '',
          email: '',
          phone: '',
          password: '',
          country: '',
          city: '',
          bio: '',
          agree: false,
          gender: 'male'
        });

        const countryOptions = [
          { label: '中国', value: 'china' },
          { label: '美国', value: 'usa' },
          { label: '英国', value: 'uk' },
          { label: '日本', value: 'japan' }
        ];

        const cityOptions = [
          { label: '北京', value: 'beijing' },
          { label: '上海', value: 'shanghai' },
          { label: '广州', value: 'guangzhou' }
        ];

        return { form, countryOptions, cityOptions };
      },
      template: `
        <el-form label-width="80px">
          <div class="form-row">
            <div class="form-item">
              <el-form-item label="用户名">
                <el-input id="el-username" v-model="form.username" placeholder="请输入用户名" />
              </el-form-item>
            </div>
            <div class="form-item">
              <el-form-item label="邮箱">
                <el-input id="el-email" v-model="form.email" placeholder="example@mail.com" />
              </el-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <el-form-item label="密码">
                <el-input id="el-password" v-model="form.password" type="password" placeholder="请输入密码" />
              </el-form-item>
            </div>
            <div class="form-item">
              <el-form-item label="电话">
                <el-input id="el-phone" v-model="form.phone" placeholder="请输入电话号码" />
              </el-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <el-form-item label="国家">
                <el-select id="el-country" v-model="form.country" placeholder="请选择国家">
                  <el-option v-for="c in countryOptions" :key="c.value" :label="c.label" :value="c.value" />
                </el-select>
              </el-form-item>
            </div>
            <div class="form-item">
              <el-form-item label="城市">
                <el-select id="el-city" v-model="form.city" placeholder="请选择城市">
                  <el-option v-for="c in cityOptions" :key="c.value" :label="c.label" :value="c.value" />
                </el-select>
              </el-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <el-form-item label="简介">
                <el-input id="el-bio" v-model="form.bio" type="textarea" placeholder="请输入简介" :rows="2" />
              </el-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <el-form-item>
                <el-checkbox id="el-agree" v-model="form.agree">我同意服务条款</el-checkbox>
              </el-form-item>
            </div>
            <div class="form-item">
              <el-form-item label="性别">
                <el-radio-group id="el-gender" v-model="form.gender">
                  <el-radio value="male">男</el-radio>
                  <el-radio value="female">女</el-radio>
                </el-radio-group>
              </el-form-item>
            </div>
          </div>
        </el-form>
      `
    };

    const app = createApp(App);
    app.use(ElementPlus);
    app.mount('#app');
    console.log('[Element Plus] 组件已挂载');
  </script>
</body>
</html>
