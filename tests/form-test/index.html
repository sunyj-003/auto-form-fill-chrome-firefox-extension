<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单自动填充测试 - 主流框架</title>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/element-plus/dist/index.full.js"></script>

  <!-- Ant Design Vue -->
  <link rel="stylesheet" href="https://unpkg.com/ant-design-vue@4.x/dist/antd.min.css">
  <script src="https://unpkg.com/ant-design-vue@4.x/dist/antd.min.js"></script>

  <!-- React Select -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/react-select@5/dist/react-select.min.css">
  <script src="https://unpkg.com/react-select@5/dist/react-select.min.js"></script>

  <!-- Material UI -->
  <script src="https://unpkg.com/@mui/material@5/umd/material-ui.production.min.js"></script>
  <script src="https://unpkg.com/@emotion/react@11/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/@emotion/styled@11/umd/emotion-styled.production.min.js"></script>

  <!-- jQuery + Select2 -->
  <script src="https://unpkg.com/jquery@3/dist/jquery.min.js"></script>
  <script src="https://unpkg.com/select2@4/dist/js/select2.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/select2@4/dist/css/select2.min.css">

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 30px; }
    h2 { color: #666; margin: 30px 0 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .form-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 200px; }
    .form-item label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    .form-item input, .form-item select, .form-item textarea { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
    .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: #409eff; outline: none; }
    button.test-btn { background: #409eff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 20px 0; }
    button.test-btn:hover { background: #66b1ff; }
    #app { display: none; }
    .native-form .form-item input::placeholder { color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>表单自动填充测试 - 主流前端框架</h1>
    <button class="test-btn" onclick="window.__bengaliFakeFill && window.__bengaliFakeFill()">🎯 点击填充表单 (快捷键: Ctrl+Shift+V 然后 V)</button>

    <!-- 1. 原生 HTML 表单 -->
    <div class="form-section native-form">
      <h2>1. 原生 HTML 表单</h2>
      <form id="nativeForm">
        <div class="form-row">
          <div class="form-item">
            <label>用户名 (text)</label>
            <input type="text" id="native-username" placeholder="请输入用户名">
          </div>
          <div class="form-item">
            <label>邮箱 (email)</label>
            <input type="email" id="native-email" placeholder="example@mail.com">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>密码 (password)</label>
            <input type="password" id="native-password" placeholder="请输入密码">
          </div>
          <div class="form-item">
            <label>电话 (tel)</label>
            <input type="tel" id="native-phone" placeholder="请输入电话号码">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>年龄 (number)</label>
            <input type="number" id="native-age" placeholder="请输入年龄" min="18" max="100">
          </div>
          <div class="form-item">
            <label>个人简介 (textarea)</label>
            <textarea id="native-bio" rows="2" placeholder="请输入个人简介"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>国家 (select)</label>
            <select id="native-country">
              <option value="">请选择国家</option>
              <option value="cn">中国</option>
              <option value="us">美国</option>
              <option value="uk">英国</option>
              <option value="jp">日本</option>
            </select>
          </div>
          <div class="form-item">
            <label>语言 (multiple select)</label>
            <select id="native-language" multiple size="3">
              <option value="zh">中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>
              <input type="checkbox" id="native-agree"> 我同意服务条款
            </label>
            <label>
              <input type="checkbox" id="native-newsletter"> 订阅 newsletter
            </label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>性别 (radio)</label>
            <label><input type="radio" name="native-gender" value="male"> 男</label>
            <label><input type="radio" name="native-gender" value="female"> 女</label>
            <label><input type="radio" name="native-gender" value="other"> 其他</label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>头像 (file)</label>
            <input type="file" id="native-avatar" accept="image/*">
          </div>
          <div class="form-item">
            <label>个人网站 (url)</label>
            <input type="url" id="native-website" placeholder="https://example.com">
          </div>
        </div>
      </form>
    </div>

    <!-- 2. Element Plus 表单 -->
    <div class="form-section" id="elementPlusApp">
      <h2>2. Element Plus (Vue 3)</h2>
      <el-form :model="form" label-width="100px">
        <el-form-item label="用户名">
          <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
        </el-form-item>
        <el-form-item label="邮箱">
          <el-input v-model="form.email" placeholder="example@mail.com"></el-input>
        </el-form-item>
        <el-form-item label="密码">
          <el-input v-model="form.password" type="password" placeholder="请输入密码"></el-input>
        </el-form-item>
        <el-form-item label="电话">
          <el-input v-model="form.phone" placeholder="请输入电话号码"></el-input>
        </el-form-item>
        <el-form-item label="年龄">
          <el-input-number v-model="form.age" :min="18" :max="100"></el-input-number>
        </el-form-item>
        <el-form-item label="简介">
          <el-input type="textarea" v-model="form.bio" rows="2" placeholder="请输入个人简介"></el-input>
        </el-form-item>
        <el-form-item label="性别">
          <el-select v-model="form.gender" placeholder="请选择性别">
            <el-option label="男" value="male"></el-option>
            <el-option label="女" value="female"></el-option>
            <el-option label="其他" value="other"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="国家">
          <el-select v-model="form.country" placeholder="请选择国家">
            <el-option label="中国" value="cn"></el-option>
            <el-option label="美国" value="us"></el-option>
            <el-option label="英国" value="uk"></el-option>
            <el-option label="日本" value="jp"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="生日">
          <el-date-picker v-model="form.birthday" type="date" placeholder="选择日期"></el-date-picker>
        </el-form-item>
        <el-form-item>
          <el-checkbox v-model="form.agree">我同意服务条款</el-checkbox>
        </el-form-item>
        <el-form-item>
          <el-radio-group v-model="form.newsletter">
            <el-radio label="daily">每日</el-radio>
            <el-radio label="weekly">每周</el-radio>
            <el-radio label="monthly">每月</el-radio>
          </el-radio-group>
        </el-form-item>
      </el-form>
    </div>

    <!-- 3. Ant Design Vue 表单 -->
    <!-- 注意：CDN 版本 Ant Design Vue 存在兼容性问题，使用原生 input 替代 a-input -->
    <div class="form-section" id="antdApp">
      <h2>3. Ant Design Vue</h2>
      <form class="antd-form">
        <div class="form-row">
          <div class="form-item">
            <label>用户名</label>
            <input type="text" class="ant-input" id="antd-username" placeholder="请输入用户名">
          </div>
          <div class="form-item">
            <label>邮箱</label>
            <input type="email" class="ant-input" id="antd-email" placeholder="example@mail.com">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>密码</label>
            <input type="password" class="ant-input" id="antd-password" placeholder="请输入密码">
          </div>
          <div class="form-item">
            <label>电话</label>
            <input type="tel" class="ant-input" id="antd-phone" placeholder="请输入电话号码">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>国家</label>
            <select id="antd-country" class="ant-select">
              <option value="">请选择国家</option>
              <option value="cn">中国</option>
              <option value="us">美国</option>
              <option value="uk">英国</option>
              <option value="jp">日本</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>
              <input type="checkbox" id="antd-agree"> 我同意服务条款
            </label>
          </div>
        </div>
      </form>
    </div>

    <!-- 4. React Select -->
    <div class="form-section" id="reactSelectApp">
      <h2>4. React Select (via CDN)</h2>
      <div id="react-select-container"></div>
    </div>

    <!-- 5. Material UI -->
    <div class="form-section" id="muiApp">
      <h2>5. Material UI</h2>
      <form class="mui-form">
        <div class="form-row">
          <div class="form-item">
            <label class="MuiFormLabel-root">用户名</label>
            <input type="text" id="mui-username" class="MuiTextField-root" placeholder="请输入用户名">
          </div>
          <div class="form-item">
            <label class="MuiFormLabel-root">邮箱</label>
            <input type="email" id="mui-email" class="MuiTextField-root" placeholder="example@mail.com">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label class="MuiFormLabel-root">密码</label>
            <input type="password" id="mui-password" class="MuiTextField-root" placeholder="请输入密码">
          </div>
          <div class="form-item">
            <label class="MuiFormLabel-root">电话</label>
            <input type="tel" id="mui-phone" class="MuiTextField-root" placeholder="请输入电话号码">
          </div>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label class="MuiFormLabel-root">国家</label>
            <select id="mui-country" class="MuiTextField-root">
              <option value="">请选择国家</option>
              <option value="cn">中国</option>
              <option value="us">美国</option>
              <option value="uk">英国</option>
              <option value="jp">日本</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- 6. jQuery Select2 -->
    <div class="form-section">
      <h2>6. jQuery Select2</h2>
      <div class="form-row">
        <div class="form-item">
          <label>国家 (Select2)</label>
          <select id="select2-country" class="select2" style="width: 100%">
            <option value="">请选择国家</option>
            <option value="cn">中国</option>
            <option value="us">美国</option>
            <option value="uk">英国</option>
            <option value="jp">日本</option>
          </select>
        </div>
        <div class="form-item">
          <label>语言 (Select2 多选)</label>
          <select id="select2-language" class="select2" multiple style="width: 100%">
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== 1. 原生 HTML 表单 ====================
    // ==================== 2. Element Plus (Vue 3) ====================
    const { createApp, ref, reactive, onMounted } = Vue;

    const elementPlusApp = createApp({
      setup() {
        const form = reactive({
          username: '',
          email: '',
          password: '',
          phone: '',
          age: 0,
          bio: '',
          gender: '',
          country: '',
          birthday: '',
          agree: false,
          newsletter: ''
        });
        return { form };
      }
    });
    elementPlusApp.use(ElementPlus);
    elementPlusApp.mount('#elementPlusApp');
    document.getElementById('app').style.display = 'block';

    // ==================== 3. Ant Design Vue ====================
    const antdApp = createApp({
      setup() {
        const form = reactive({
          username: '',
          email: '',
          password: '',
          phone: '',
          age: 18,
          bio: '',
          gender: undefined,
          country: undefined,
          agree: false
        });
        return { form };
      }
    });
    antdApp.use(Antd);
    antdApp.mount('#antdApp');

    // ==================== 4. React Select ====================
    function initReactSelect() {
      const container = document.getElementById('react-select-container');

      // 模拟 React 组件
      container.innerHTML = `
        <div class="form-row">
          <div class="form-item">
            <label>国家 (React Select)</label>
            <select id="react-select-country" class="react-select">
              <option value="">请选择国家</option>
              <option value="cn">中国</option>
              <option value="us">美国</option>
              <option value="uk">英国</option>
              <option value="jp">日本</option>
            </select>
          </div>
          <div class="form-item">
            <label>语言 (React Select)</label>
            <select id="react-select-language" class="react-select" multiple>
              <option value="zh">中文</option>
              <option value="en">英文</option>
              <option value="ja">日文</option>
            </select>
          </div>
        </div>
      `;

      // 初始化 React Select
      setTimeout(() => {
        $('#react-select-country').select2({ placeholder: '请选择国家' });
        $('#react-select-language').select2({ placeholder: '请选择语言', multiple: true });
      }, 100);
    }
    initReactSelect();

    // ==================== 5. jQuery Select2 ====================
    $(document).ready(function() {
      $('.select2').select2({ placeholder: '请选择', allowClear: true });
    });

    // ==================== 键盘快捷键 ====================
    document.addEventListener('keydown', function(e) {
      // Ctrl+Shift+V 然后 V 触发填充
      if (e.ctrlKey && e.shiftKey && e.key === 'V') {
        e.preventDefault();
        window.__bengaliFakeFill && window.__bengaliFakeFill();
      }
    });

    // 双击 V 触发
    let vPressed = false;
    document.addEventListener('keydown', function(e) {
      if (e.key === 'v' || e.key === 'V') {
        if (vPressed) {
          window.__bengaliFakeFill && window.__bengaliFakeFill();
          vPressed = false;
        } else {
          vPressed = true;
          setTimeout(() => vPressed = false, 500);
        }
      }
    });
  </script>
</body>
</html>
