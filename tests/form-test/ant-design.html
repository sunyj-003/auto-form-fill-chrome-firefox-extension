<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单自动填充测试 - Ant Design</title>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 30px; }
    h2 { color: #666; margin: 30px 0 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    .form-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 200px; }
    .form-item label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    button.test-btn { background: #1890ff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>表单自动填充测试 - Ant Design 框架</h1>
    <button class="test-btn" onclick="window.__bengaliFakeFill && window.__bengaliFakeFill()">🎯 点击填充表单</button>

    <div class="form-section">
      <h2>Ant Design 表单</h2>
      <div id="app"></div>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/ant-design-vue@4.3.3/dist/antd.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/ant-design-vue@4.3.3/dist/reset.css">

  <script>
    const { createApp, ref, reactive } = Vue;

    const App = {
      setup() {
        const form = reactive({
          username: '',
          email: '',
          phone: '',
          password: '',
          country: undefined,
          city: undefined,
          bio: '',
          agree: false,
          gender: 'male'
        });

        const countryOptions = [
          { label: '中国', value: 'china' },
          { label: '美国', value: 'usa' },
          { label: '英国', value: 'uk' },
          { label: '日本', value: 'japan' }
        ];

        const cityOptions = [
          { label: '北京', value: 'beijing' },
          { label: '上海', value: 'shanghai' },
          { label: '广州', value: 'guangzhou' }
        ];

        return { form, countryOptions, cityOptions };
      },
      template: `
        <a-form :model="form" layout="horizontal">
          <div class="form-row">
            <div class="form-item">
              <a-form-item label="用户名">
                <a-input id="ant-username" v-model:value="form.username" placeholder="请输入用户名" />
              </a-form-item>
            </div>
            <div class="form-item">
              <a-form-item label="邮箱">
                <a-input id="ant-email" v-model:value="form.email" placeholder="example@mail.com" />
              </a-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <a-form-item label="密码">
                <a-input-password id="ant-password" v-model:value="form.password" placeholder="请输入密码" />
              </a-form-item>
            </div>
            <div class="form-item">
              <a-form-item label="电话">
                <a-input id="ant-phone" v-model:value="form.phone" placeholder="请输入电话号码" />
              </a-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <a-form-item label="国家">
                <a-select id="ant-country" v-model:value="form.country" placeholder="请选择国家" :options="countryOptions" />
              </a-form-item>
            </div>
            <div class="form-item">
              <a-form-item label="城市">
                <a-select id="ant-city" v-model:value="form.city" placeholder="请选择城市" :options="cityOptions" />
              </a-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <a-form-item label="简介">
                <a-textarea id="ant-bio" v-model:value="form.bio" placeholder="请输入简介" :rows="2" />
              </a-form-item>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <a-form-item>
                <a-checkbox id="ant-agree" v-model:checked="form.agree">我同意服务条款</a-checkbox>
              </a-form-item>
            </div>
            <div class="form-item">
              <a-form-item label="性别">
                <a-radio-group id="ant-gender" v-model:value="form.gender">
                  <a-radio value="male">男</a-radio>
                  <a-radio value="female">女</a-radio>
                </a-radio-group>
              </a-form-item>
            </div>
          </div>
        </a-form>
      `
    };

    const app = createApp(App);
    app.use(antd);
    app.mount('#app');
    console.log('[Ant Design] 组件已挂载');
  </script>
</body>
</html>
