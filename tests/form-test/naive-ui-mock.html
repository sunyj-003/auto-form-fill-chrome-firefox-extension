<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单自动填充测试 - Naive UI 模拟</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #333; margin-bottom: 30px; }
    .form-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .form-item { flex: 1; min-width: 200px; }
    .form-item label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
    button.test-btn { background: #18a058; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin: 20px 0; }

    /* Naive UI 模拟样式 */
    .n-input { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; }
    .n-input:focus { border-color: #18a058; outline: none; }
    .n-input__textarea-el { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; width: 100%; min-height: 60px; }
    .n-base-selection { border: 1px solid #ddd; border-radius: 4px; padding: 8px 12px; cursor: pointer; position: relative; }
    .n-base-selection-trigger { cursor: pointer; }
    .n-checkbox-box { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .n-radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .n-form-item { margin-bottom: 15px; }
    .n-select-menu { position: absolute; background: white; border: 1px solid #ddd; border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 1000; }
    .n-base-select-option { padding: 8px 12px; cursor: pointer; }
    .n-base-select-option:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div class="container">
    <h1>表单自动填充测试 - Naive UI 模拟结构</h1>
    <button class="test-btn" onclick="window.__bengaliFakeFill && window.__bengaliFakeFill()">🎯 点击填充表单</button>

    <div class="form-section">
      <div class="form-row">
        <div class="form-item">
          <label>用户名</label>
          <input type="text" id="naive-username" class="n-input" placeholder="请输入用户名" />
        </div>
        <div class="form-item">
          <label>邮箱</label>
          <input type="text" id="naive-email" class="n-input" placeholder="example@mail.com" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>密码</label>
          <input type="password" id="naive-password" class="n-input" placeholder="请输入密码" />
        </div>
        <div class="form-item">
          <label>电话</label>
          <input type="text" id="naive-phone" class="n-input" placeholder="请输入电话号码" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>国家</label>
          <div id="naive-country" class="n-base-selection">
            <span class="n-base-selection-trigger">请选择国家</span>
          </div>
        </div>
        <div class="form-item">
          <label>城市</label>
          <div id="naive-city" class="n-base-selection">
            <span class="n-base-selection-trigger">请选择城市</span>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label>简介</label>
          <textarea id="naive-bio" class="n-input__textarea-el" placeholder="请输入简介"></textarea>
        </div>
      </div>
      <div class="form-row">
        <div class="form-item">
          <label class="n-checkbox-box">
            <input type="checkbox" id="naive-agree" />
            <span>我同意服务条款</span>
          </label>
        </div>
        <div class="form-item">
          <label>性别</label>
          <div id="naive-gender">
            <label class="n-radio">
              <input type="radio" name="gender" value="male" />
              <span>男</span>
            </label>
            <label class="n-radio">
              <input type="radio" name="gender" value="female" />
              <span>女</span>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 模拟下拉菜单 (初始隐藏) -->
    <div class="n-select-menu" style="display: none;">
      <div class="n-base-select-option">选项 1</div>
      <div class="n-base-select-option">选项 2</div>
      <div class="n-base-select-option">选项 3</div>
    </div>
  </div>
</body>
</html>
